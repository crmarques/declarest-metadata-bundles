resource:
  id: "{{/id}}"
  alias: "{{/id}}"
operations:
  create:
    method: POST
    path: /orgs/{{/org}}/teams
  get:
    path: /teams/{{/id}}
  update:
    method: PATCH
    path: /teams/{{/id}}
  delete:
    path: /teams/{{/id}}
  list:
    path: /orgs/{{/org}}/teams
  compare:
    path: /teams/{{/id}}
